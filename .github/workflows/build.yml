name: Build

on:
  push:
    branches: [main]
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.head_ref) || 'build-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential ninja-build python3-venv libsndfile1-dev \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxkbcommon-dev '^libxcb.*-dev' libx11-xcb-dev \
            libglu1-mesa-dev libxrender-dev libxi-dev libxkbfile-dev

      - name: Install Qt 6.11.2 and CMake as documented
        run: |
          python3 -m venv "$HOME/.local/share/dissco-tools"
          . "$HOME/.local/share/dissco-tools/bin/activate"
          python -m pip install 'aqtinstall==3.3.*' 'cmake>=3.25,<4'
          python -m aqt install-qt linux desktop 6.11.2 linux_gcc_64 \
            --outputdir "$HOME/Qt"
          test "$("$HOME/Qt/6.11.2/gcc_64/bin/qmake" -query QT_VERSION)" = "6.11.2"
          cmake --version
          printf '%s\n' "$HOME/.local/share/dissco-tools/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake --fresh -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.11.2/gcc_64"

      - name: Build
        run: cmake --build build --parallel 2 --verbose

      - name: Test Qt UI integration
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Smoke-test desktop startup and CMOD
        run: |
          sudo apt-get install -y xvfb xauth
          status=0
          xvfb-run -a timeout 5s build/LASSIE/lassie > lassie-startup.log 2>&1 || status=$?
          cat lassie-startup.log
          if [[ "$status" -ne 124 ]]; then
            echo "LASSIE exited before the startup timeout (status $status)." >&2
            exit 1
          fi
          build/CMOD/cmod --help

  windows:
    name: Windows build
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Qt 6.8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install vcpkg dependencies
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw "Visual Studio with the x64 C++ toolchain was not found." }
          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
          $env:VCPKG_ROOT = $vcpkgRoot

          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics

          & "$vcpkgRoot\vcpkg.exe" install `
            libsndfile:x64-windows `
            dirent:x64-windows

      - name: Configure
        env:
          CL: /EHsc /DNOMINMAX /DNOGDI /DMUPARSER_STATIC /D_CRT_SECURE_NO_WARNINGS
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw "Visual Studio with the x64 C++ toolchain was not found." }
          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
          $env:VCPKG_ROOT = $vcpkgRoot

          Write-Host "MSVC flags: $env:CL"

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_SHARED_LIBS=OFF `
            "-DSNDFILE_INCLUDE_DIR=$vcpkgRoot\installed\x64-windows\include" `
            "-DSNDFILE_LIBRARY=$vcpkgRoot\installed\x64-windows\lib\sndfile.lib"

      - name: Build
        env:
          CL: /EHsc /DNOMINMAX /DNOGDI /DMUPARSER_STATIC /D_CRT_SECURE_NO_WARNINGS
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw "Visual Studio with the x64 C++ toolchain was not found." }
          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
          $env:VCPKG_ROOT = $vcpkgRoot

          Write-Host "MSVC flags: $env:CL"
          cmake --build build --parallel --verbose

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  macos:
    name: macOS build
    runs-on: macos-14
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew update

          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi

          dependencies=()
          command -v cmake >/dev/null 2>&1 || dependencies+=(cmake)
          command -v ninja >/dev/null 2>&1 || dependencies+=(ninja)
          brew list --versions libsndfile >/dev/null 2>&1 || dependencies+=(libsndfile)

          if (( ${#dependencies[@]} )); then
            brew install "${dependencies[@]}"
          fi

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: mac
          target: desktop
          arch: clang_64
          modules: ""
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build
        run: cmake --build build --parallel --verbose

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
