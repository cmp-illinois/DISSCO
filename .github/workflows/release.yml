name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version for a draft release (e.g. v2.2.0). Leave empty to build workflow artifacts only."
        required: false

permissions:
  contents: write

jobs:
  macos:
    name: macOS arm64 packages
    # GitHub retired the macos-14 image on 2026-11-02. Configure below still
    # builds DISSCO for macOS 14. -- Tony Chai, 2026
    runs-on: macos-15
    env:
      DISSCO_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
      # Developer ID signing and notarization run only when the Apple secrets
      # are configured. Without them, release DMGs are ad-hoc signed (the same
      # as non-release builds) and users must approve the app on first launch.
      DISSCO_HAS_SIGNING_SECRETS: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Warn about unsigned macOS release
        if: env.DISSCO_RELEASE_BUILD == 'true' && env.DISSCO_HAS_SIGNING_SECRETS != 'true'
        run: echo "::warning title=Unsigned macOS release::MACOS_CERTIFICATE_P12 is not configured; the DMG will be ad-hoc signed and not notarized."

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja libsndfile dylibbundler

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: mac
          target: desktop
          arch: clang_64
          modules: ""
          cache: true

      - name: Import Apple Developer ID certificate
        if: env.DISSCO_RELEASE_BUILD == 'true' && env.DISSCO_HAS_SIGNING_SECRETS == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12:?Missing MACOS_CERTIFICATE_P12 secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD secret}"

          certificate_path="${RUNNER_TEMP}/dissco-signing.p12"
          keychain_path="${RUNNER_TEMP}/dissco-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          trap 'rm -f "${certificate_path}"' EXIT
          printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${certificate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          codesign_identity="$(
            security find-identity -v -p codesigning "${keychain_path}" |
              sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' |
              head -n 1
          )"
          if [[ -z "${codesign_identity}" ]]; then
            echo "The imported certificate is not a Developer ID Application certificate." >&2
            exit 1
          fi
          printf 'DISSCO_CODESIGN_IDENTITY=%s\n' "${codesign_identity}" >> "${GITHUB_ENV}"
          printf 'DISSCO_KEYCHAIN_PATH=%s\n' "${keychain_path}" >> "${GITHUB_ENV}"

      - name: Configure
        run: |
          set -euo pipefail
          cmake_args=(
            -S .
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            # Keep the app running on macOS 14 even though it's built on 15.
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
            "-DCMAKE_PREFIX_PATH=${QT_ROOT_DIR}"
          )
          if [[ "${DISSCO_RELEASE_BUILD}" == "true" && "${DISSCO_HAS_SIGNING_SECRETS}" == "true" ]]; then
            : "${DISSCO_CODESIGN_IDENTITY:?Developer ID certificate was not imported}"
            cmake_args+=(
              "-DDISSCO_CODESIGN_IDENTITY=${DISSCO_CODESIGN_IDENTITY}"
            )
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Package (DMG)
        run: cmake --build build --target package

      - name: Test bundled Qt application
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_paths=(build/DISSCO-*-Darwin.dmg)
          if [[ ${#dmg_paths[@]} -ne 1 ]]; then
            echo "Expected exactly one DISSCO DMG; found ${#dmg_paths[@]}." >&2
            exit 1
          fi
          packaging/macos/smoke-test-dissco-dmg.sh "${dmg_paths[0]}"

      - name: Sign, notarize, and verify DMG
        if: env.DISSCO_RELEASE_BUILD == 'true' && env.DISSCO_HAS_SIGNING_SECRETS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing APPLE_ID secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD secret}"

          shopt -s nullglob
          dmg_paths=(build/DISSCO-*-Darwin.dmg)
          if [[ ${#dmg_paths[@]} -ne 1 ]]; then
            echo "Expected exactly one DISSCO DMG; found ${#dmg_paths[@]}." >&2
            exit 1
          fi
          dmg_path="${dmg_paths[0]}"

          codesign \
            --force \
            --timestamp \
            --sign "${DISSCO_CODESIGN_IDENTITY}" \
            "${dmg_path}"
          xcrun notarytool submit "${dmg_path}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
          xcrun stapler staple "${dmg_path}"
          packaging/macos/verify-dissco-dmg.sh "${dmg_path}"

      - name: Package standalone CMOD
        run: cmake --build build --target cmod-package

      - uses: actions/upload-artifact@v5
        with:
          name: macos-packages
          if-no-files-found: error
          path: |
            build/DISSCO-*-Darwin.dmg
            build/CMOD-*-Darwin-*.tar.gz

      - name: Delete temporary signing keychain
        if: always() && env.DISSCO_RELEASE_BUILD == 'true' && env.DISSCO_HAS_SIGNING_SECRETS == 'true'
        run: |
          keychain_path="${DISSCO_KEYCHAIN_PATH:-${RUNNER_TEMP}/dissco-signing.keychain-db}"
          if [[ -f "${keychain_path}" ]]; then
            security delete-keychain "${keychain_path}"
          fi
          rm -f "${RUNNER_TEMP}/dissco-signing.p12"

  linux:
    name: Linux x86_64 packages
    # Pinned to 22.04 for older glibc: AppImages built here run on more
    # downstream distros than ones built on 24.04+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libsndfile1-dev \
            libgl1-mesa-dev libfuse2 \
            file desktop-file-utils \
            libxkbcommon-dev '^libxcb.*-dev' libx11-xcb-dev \
            libglu1-mesa-dev libxrender-dev libxi-dev libxkbfile-dev

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@v4
        with:
          # Match the Linux build workflow; Ubuntu 22.04's apt Qt is too old.
          version: "6.11.2"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ""
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test Qt UI integration
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Package (AppImage)
        env:
          # linuxdeploy-plugin-qt picks up qmake via QMAKE; install-qt-action
          # exports QT_ROOT_DIR and prepends Qt's bin/ to PATH, so qmake6 is
          # findable, but be explicit to avoid surprises.
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: cmake --build build --target appimage

      - name: Test bundled Qt application
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
          DISSCO_TEST_APPLICATION_IDENTITY: "1"
        run: |
          appimages=(build/DISSCO-*-Linux-*.AppImage)
          test "${#appimages[@]}" -eq 1
          "${appimages[0]}"

      - name: Package standalone CMOD
        run: cmake --build build --target cmod-package

      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            build/DISSCO-*-Linux-*.AppImage
            build/CMOD-*-Linux-*.AppImage

  windows:
    name: Windows x64 packages
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install Qt 6.8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ""
          cache: true

      - name: Configure
        # libsndfile is resolved by FindSndFile, which downloads libsndfile's
        # official Windows prebuilt zip when no local install is present
        # (DISSCO_SNDFILE_FETCH_PREBUILT, ON by default on Windows). Qt comes
        # from install-qt-action's exported QT_ROOT_DIR. XML parsing uses the
        # bundled pugixml, so there's no external XML dependency.
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Package (NSIS installer)
        run: cmake --build build --target package

      - name: Package standalone CMOD
        run: cmake --build build --target cmod-package

      - uses: actions/upload-artifact@v5
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            build/DISSCO-*-Windows.exe
            build/CMOD-*-Windows-x64.zip

  release:
    name: Publish GitHub release
    needs: [macos, linux, windows]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Validate release tag and assets
        run: |
          major=$(sed -n 's/set(DISSCO_VER_MAJOR \([0-9][0-9]*\))/\1/p' DISSCOVersions.txt)
          minor=$(sed -n 's/set(DISSCO_VER_MINOR \([0-9][0-9]*\))/\1/p' DISSCOVersions.txt)
          patch=$(sed -n 's/set(DISSCO_VER_PATCH \([0-9][0-9]*\))/\1/p' DISSCOVersions.txt)
          expected="v${major}.${minor}.${patch}"
          if [[ "${RELEASE_TAG}" != "${expected}" ]]; then
            echo "Release tag ${RELEASE_TAG} must match ${expected}." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_commit=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
            if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Existing tag ${RELEASE_TAG} must match the current commit ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

          cd dist
          for pattern in \
            'DISSCO-*-Darwin.dmg' \
            'DISSCO-*-Linux-*.AppImage' \
            'DISSCO-*-Windows.exe' \
            'CMOD-*-Darwin-*.tar.gz' \
            'CMOD-*-Linux-*.AppImage' \
            'CMOD-*-Windows-x64.zip'; do
            compgen -G "${pattern}" > /dev/null || {
              echo "Missing release asset: ${pattern}" >&2
              exit 1
            }
          done

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
